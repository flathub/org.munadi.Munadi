app-id: org.munadi.Munadi
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: munadi
finish-args:
  - --device=dri
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/cmake
  - /lib/HasanEsa
  - /lib/qml
  - '*.la'
  - '*.a'
modules:
  - name: munadi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    patches:
      - disable-fileman-cet.patch
    sources:
      - type: git
        url: https://gitlab.com/munadi/munadi.git
        tag: "26.06"
        commit: 288daa1eb859cdfff2a0fea10b9544ef7164a167
